services:
  tainer:
    image: tainersh/tainer:latest
    ports:
      - "3000:3000"
    volumes:
      - tainer-data:/app/data
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
    # Optional settings — only needed for password reset emails or custom port
    #   PORT: "3000"
    #   APP_URL: https://tainer.example.com
    #   SMTP_HOST: smtp.example.com
    #   SMTP_PORT: "587"
    #   SMTP_USER: user@example.com
    #   SMTP_PASS: yourpassword
    #   SMTP_FROM: tainer@example.com

volumes:
  tainer-data:
