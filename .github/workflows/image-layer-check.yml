name: image-layer-check

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-image-layers.sh"
      - ".github/workflows/image-layer-check.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image into local daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tainer:gate

      - name: Inspect image layers for source-artifact leaks
        run: scripts/check-image-layers.sh tainer:gate
