name: image-layer-check

# Build a single-arch Docker image and run scripts/check-image-layers.sh
# against it, failing the build if any source maps, TypeScript files, or
# debug artifacts leak into the published layers (F1/F10 class). Runs on
# every PR that touches the build pipeline and on pushes to main so a
# regression can't slip in unobserved.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-image-layers.sh"
      - ".github/workflows/image-layer-check.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image into local daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tainer:gate
          # No registry push — the image is consumed by the next step only.

      - name: Inspect image layers for source-artifact leaks
        run: scripts/check-image-layers.sh tainer:gate
