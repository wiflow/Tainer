name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v2.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      IMAGE: tainersh/tainer
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image for the layer check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tainer:gate
          build-args: TAINER_VERSION=${{ steps.version.outputs.version }}

      - name: Check image layers
        run: scripts/check-image-layers.sh tainer:gate

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: TAINER_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Source archive
        id: archive
        run: |
          name="tainer-${{ steps.version.outputs.version }}.tar.gz"
          git archive --format=tar.gz --prefix="tainer-${{ steps.version.outputs.version }}/" -o "$name" HEAD
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Attest source archive
        id: attest-source
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.file }}

      - name: Release notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n**Docker image:** `%s:%s` (`%s`)\n' "$IMAGE" "${{ steps.version.outputs.version }}" "${{ steps.push.outputs.digest }}" >> notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for this version"; exit 1; }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outputs.file }}
          BUNDLE: ${{ steps.attest-source.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$ARCHIVE.sigstore.json"
          gh release create "$TAG" --verify-tag --title "Tainer ${TAG#v}" --notes-file notes.md "$ARCHIVE" "$ARCHIVE.sigstore.json"
